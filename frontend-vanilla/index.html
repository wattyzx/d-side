<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>D(e)Side — Decide what to dig</title>
    <link rel="stylesheet" href="/src/style.css">
  </head>
  <body>
    <main>
      <header>
        <a class="brand" href="/">D(e)Side</a>
        <div id="account" aria-label="Discogs account"></div>
      </header>
      <div class="content">
        <p id="account-error" class="error" role="alert"></p>
        <form id="search-form">
          <label for="seller">Seller</label>
          <input id="seller" name="seller" placeholder="Discogs seller name" required autocomplete="off">
          <button id="search" disabled>Find records</button>
          <button id="cancel" type="button" hidden>Cancel search</button>
        </form>
        <p id="status" role="status" aria-live="polite">Checking your connection…</p>
        <p id="notice"></p>
        <p id="error" class="error" role="alert"></p>
        <div class="results-layout">
          <section id="results-section" hidden>
            <h2>Recommendations <span id="results-count"></span></h2>
            <ol id="results"></ol>
            <p id="empty" hidden>No recommendations above 0.1 found so far.</p>
            <button id="more" type="button">Search more</button>
          </section>
          <section id="wantlist-section" hidden>
            <h2>Wantlist <span id="wantlist-count"></span></h2>
            <ol id="wantlist"></ol>
          </section>
        </div>
      </div>
      <noscript>This frontend needs JavaScript for login status and streamed recommendations.</noscript>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
